# Project-wide settings
# SemVer (also mirrored in root VERSION file)
VERSION=1.0.0

# UI language: en | ru | auto
# Default is English. auto = follow Windows UI language (ru -> Russian, otherwise English)
LANGUAGE=en

# winget install/upgrade scope: machine | user | auto
# machine = all users on the computer (default; usually needs Administrator)
# user    = current user only
# auto    = let winget choose (no --scope flag)
WINGET_SCOPE=machine
