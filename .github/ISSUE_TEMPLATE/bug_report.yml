name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Redact API keys and other secrets** from logs and screenshots.
        Security issues → [Security Advisories](https://github.com/sbezpalov/dev-workstation-maintenance/security/advisories/new).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version
      description: Contents of the VERSION file (e.g. 1.0.0)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: elevated
    attributes:
      label: Ran as Administrator?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Exact command line you ran
      render: cmd
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: From logs/ — secrets redacted
      render: text
