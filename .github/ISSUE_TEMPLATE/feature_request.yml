name: Feature request
description: Propose a flag, package, or cleanup target
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed change. Prefer fitting the existing `cmd` + `winget` model.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Flag name, config key, winget ID, cleanup path, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: maintain-dev-workstation / packages.list
        - label: optional AI apps (optional-apps.list)
        - label: OpenClaw / OpenRouter
        - label: disk cleanup
        - label: docs / i18n
        - label: other
